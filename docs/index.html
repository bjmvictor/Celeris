<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Biblioteca de processos, configurações e solução de problemas do Celeris.">
    <title>Biblioteca Celeris</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.png">
    <link rel="stylesheet" href="assets/documentacao.css">
    <script src="assets/documentacao.js" defer></script>
  </head>
  <body>
    <header class="docs-topbar">
      <a class="docs-brand" href="#inicio" aria-label="Início da Biblioteca Celeris">
        <img src="assets/logo.png" alt="Celeris">
        <span><strong>Biblioteca Celeris</strong><small>Manual operacional e técnico</small></span>
      </a>
      <div class="docs-topbar-actions">
        <span class="docs-version" data-docs-version>Carregando…</span>
        <button class="icon-button" type="button" data-theme-toggle title="Alternar tema" aria-label="Alternar tema">◐</button>
        <a class="button button-primary" href="admin/" title="Entrar para editar a documentação">Editar documentação</a>
      </div>
    </header>

    <main class="docs-layout">
      <article class="docs-content" data-topic-content aria-live="polite">
        <div class="docs-loading">Carregando biblioteca…</div>
      </article>

      <aside class="docs-sidebar" aria-label="Tópicos da documentação">
        <div class="docs-search-wrap">
          <label for="docs-search">Buscar na biblioteca</label>
          <div class="docs-search-field">
            <span aria-hidden="true">⌕</span>
            <input id="docs-search" type="search" placeholder="Ex.: recepção, usuário, erro…" autocomplete="off" data-docs-search>
            <kbd>/</kbd>
          </div>
          <small data-search-status>Todos os tópicos</small>
        </div>
        <nav class="docs-navigation" data-docs-navigation></nav>
        <footer class="docs-sidebar-footer">
          <span>Documentação versionada no Git</span>
          <a href="PUBLICACAO.md">Como publicar e editar</a>
        </footer>
      </aside>
    </main>

    <noscript>Ative o JavaScript para navegar e pesquisar a documentação.</noscript>
  </body>
</html>
