name: Tests

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate JavaScript
        run: node --check static/js/celeris.js && node --check static/js/document-editor.js
      - name: Validate Django
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
