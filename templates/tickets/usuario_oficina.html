{% extends "base/layout.html" %}

{% block content %}
  <form class="card table-card" data-editable-table data-table="suporte_usuario_oficina" method="post">
    {% csrf_token %}
    <table class="editable-table">
      <thead>
        <tr>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'cd_usuario_oficina_suporte' %}-{% endif %}cd_usuario_oficina_suporte">Código</a></th>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'cd_usuario__username' %}-{% endif %}cd_usuario__username">Usuário</a></th>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'cd_oficina__nm_oficina' %}-{% endif %}cd_oficina__nm_oficina">Oficina</a></th>
          <th>Ativo</th>
          <th>Atende</th>
          <th>Solicita</th>
        </tr>
      </thead>
      <tbody>
        {% for item in registros %}
          <tr data-editable-row>
            <td>
              <input value="{{ item.pk }}" readonly data-primary-key="true">
              <input data-row-delete name="delete_{{ item.pk }}" type="hidden" value="0">
            </td>
            <td>
              <select name="user_{{ item.pk }}" required>
                <option value="">Selecione</option>
                {% for usuario in usuarios %}
                  <option value="{{ usuario.pk }}" {% if item.cd_usuario_id == usuario.pk %}selected{% endif %}>{{ usuario.get_full_name|default:usuario.username }}</option>
                {% endfor %}
              </select>
            </td>
            <td>
              <select name="office_{{ item.pk }}" required>
                <option value="">Selecione</option>
                {% for oficina in oficinas %}
                  <option value="{{ oficina.pk }}" {% if item.cd_oficina_id == oficina.pk %}selected{% endif %}>{{ oficina.nm_oficina }}</option>
                {% endfor %}
              </select>
            </td>
            <td>
              <select name="active_{{ item.pk }}">
                <option value="true" {% if item.sn_ativo %}selected{% endif %}>Sim</option>
                <option value="false" {% if not item.sn_ativo %}selected{% endif %}>Não</option>
              </select>
            </td>
            <td>
              <select name="attends_{{ item.pk }}">
                <option value="true" {% if item.sn_atende %}selected{% endif %}>Sim</option>
                <option value="false" {% if not item.sn_atende %}selected{% endif %}>Não</option>
              </select>
            </td>
            <td>
              <select name="requests_{{ item.pk }}">
                <option value="true" {% if item.sn_solicita %}selected{% endif %}>Sim</option>
                <option value="false" {% if not item.sn_solicita %}selected{% endif %}>Não</option>
              </select>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="6" class="empty-cell">Nenhum dado carregado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <template data-table-new-row>
      <tr data-editable-row>
        <td><input readonly data-primary-key="true" placeholder="Automático"></td>
        <td>
          <select name="new_user" required>
            <option value="">Selecione</option>
            {% for usuario in usuarios %}
              <option value="{{ usuario.pk }}">{{ usuario.get_full_name|default:usuario.username }}</option>
            {% endfor %}
          </select>
        </td>
        <td>
          <select name="new_office" required>
            <option value="">Selecione</option>
            {% for oficina in oficinas %}
              <option value="{{ oficina.pk }}">{{ oficina.nm_oficina }}</option>
            {% endfor %}
          </select>
        </td>
        <td>
          <select name="new_active">
            <option value="true" selected>Sim</option>
            <option value="false">Não</option>
          </select>
        </td>
        <td>
          <select name="new_attends">
            <option value="true" selected>Sim</option>
            <option value="false">Não</option>
          </select>
        </td>
        <td>
          <select name="new_requests">
            <option value="true" selected>Sim</option>
            <option value="false">Não</option>
          </select>
        </td>
      </tr>
    </template>
    {% include "components/table_pager.html" %}
  </form>
{% endblock %}
