{% extends "base/layout.html" %}

{% block content %}
  <form class="card table-card" data-editable-table data-table="suporte_prioridade" method="post">
    {% csrf_token %}
    <table class="editable-table">
      <thead>
        <tr>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'cd_prioridade_suporte' %}-{% endif %}cd_prioridade_suporte">Código</a></th>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'nm_prioridade' %}-{% endif %}nm_prioridade">Prioridade</a></th>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'nr_peso' %}-{% endif %}nr_peso">Peso</a></th>
          <th>Cor</th>
          <th><a href="?consultar=1&ordem={% if request.GET.ordem == 'sn_ativo' %}-{% endif %}sn_ativo">Status</a></th>
        </tr>
      </thead>
      <tbody>
        {% for item in registros %}
          <tr data-editable-row>
            <td>
              <input value="{{ item.pk }}" readonly data-primary-key="true">
              <input data-row-delete name="delete_{{ item.pk }}" type="hidden" value="0">
            </td>
            <td><input name="name_{{ item.pk }}" value="{{ item.nm_prioridade }}" required></td>
            <td><input name="weight_{{ item.pk }}" value="{{ item.nr_peso }}" type="number" min="0"></td>
            <td><input name="color_{{ item.pk }}" value="{{ item.ds_cor|default:'#3b82f6' }}" type="color"></td>
            <td>
              <select name="active_{{ item.pk }}">
                <option value="true" {% if item.sn_ativo %}selected{% endif %}>Ativo</option>
                <option value="false" {% if not item.sn_ativo %}selected{% endif %}>Inativo</option>
              </select>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="5" class="empty-cell">Nenhum dado carregado.</td></tr>
        {% endfor %}
      </tbody>
    </table>
    <template data-table-new-row>
      <tr data-editable-row>
        <td><input readonly data-primary-key="true" placeholder="Automático"></td>
        <td><input name="new_name" placeholder="Prioridade" required></td>
        <td><input name="new_weight" value="0" type="number" min="0"></td>
        <td><input name="new_color" value="#3b82f6" type="color"></td>
        <td>
          <select name="new_active">
            <option value="true" selected>Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </td>
      </tr>
    </template>
    {% include "components/table_pager.html" %}
  </form>
{% endblock %}
