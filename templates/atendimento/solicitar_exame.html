{% extends clinical_action_base_template|default:"base/layout.html" %}
{% block content %}
  <form class="card" method="post">{% csrf_token %}
    {% if return_to %}<input type="hidden" name="return_to" value="{{ return_to }}">{% endif %}
    <div class="form-grid">{% for field in form %}<label>{{ field.label }} {{ field }} {{ field.errors }}</label>{% endfor %}</div>
    <div class="table-actions"><button class="button button-primary" type="submit">Gerar solicitação</button></div>
  </form>
{% endblock %}
