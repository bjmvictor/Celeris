{% extends "base/layout.html" %}
{% block content %}
  <form class="card table-card" data-editable-table data-table="classe_senha_atendimento" method="post">
    {% csrf_token %}
    <table class="editable-table">
      <thead><tr>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'cd_classe_senha' %}-{% endif %}cd_classe_senha">Código</a></th>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'nm_classe_senha' %}-{% endif %}nm_classe_senha">Nome da classe</a></th>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'sg_classe_senha' %}-{% endif %}sg_classe_senha">Sigla</a></th>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'nr_prioridade' %}-{% endif %}nr_prioridade">Prioridade</a></th>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'ds_icone' %}-{% endif %}ds_icone">Ícone</a></th>
        <th><a href="?q={{ request.GET.q|urlencode }}&ordem={% if request.GET.ordem == 'sn_ativo' %}-{% endif %}sn_ativo">Status</a></th>
      </tr></thead>
      <tbody>
        {% for item in registros %}
          <tr data-editable-row>
            <td><input value="{{ item.pk }}" readonly data-primary-key="true"><input data-row-delete name="delete_{{ item.pk }}" type="hidden" value="0"></td>
            <td><input name="name_{{ item.pk }}" value="{{ item.nm_classe_senha }}" required></td>
            <td><input name="acronym_{{ item.pk }}" value="{{ item.sg_classe_senha }}" maxlength="4"></td>
            <td><input name="priority_{{ item.pk }}" value="{{ item.nr_prioridade }}" type="number" min="1" required></td>
            <td><input name="icon_{{ item.pk }}" value="{{ item.ds_icone }}"></td>
            <td><select name="active_{{ item.pk }}"><option value="true" {% if item.sn_ativo %}selected{% endif %}>Ativo</option><option value="false" {% if not item.sn_ativo %}selected{% endif %}>Inativo</option></select></td>
          </tr>
        {% empty %}<tr><td colspan="6" class="empty-cell">Nenhum dado encontrado.</td></tr>{% endfor %}
      </tbody>
    </table>
    <template data-table-new-row>
      <tr data-editable-row>
        <td><input readonly data-primary-key="true" placeholder="Automático"></td>
        <td><input name="new_name" required></td>
        <td><input name="new_acronym" maxlength="4"></td>
        <td><input name="new_priority" type="number" min="1" value="5" required></td>
        <td><input name="new_icon"></td>
        <td><select name="new_active"><option value="true" selected>Ativo</option><option value="false">Inativo</option></select></td>
      </tr>
    </template>
    {% include "components/table_pager.html" %}
  </form>
{% endblock %}
