{% load static %}
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{% static 'css/celeris.css' %}">
    <style>
      .document-unavailable-page { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 16px; background: var(--page-bg, #eef3f8); }
      .document-unavailable-page .empty-state-card { width: min(560px, 100%); text-align: center; }
      .document-unavailable-page .table-actions { justify-content: center; }
    </style>
  </head>
  <body class="document-unavailable-page">
    <main class="card empty-state-card" role="status">
      <span class="svg-icon" data-nav-icon="printer" aria-hidden="true"></span>
      <h1>{{ titulo }}</h1>
      <p>{{ mensagem }}</p>
      <p>Configure o documento em <strong>{{ caminho_configuracao }}</strong>.</p>
      <div class="table-actions">
        <a class="button button-primary" href="{{ return_url }}" target="_top">Voltar para Agendar</a>
      </div>
    </main>
    <script src="{% static 'js/celeris.js' %}"></script>
  </body>
</html>
