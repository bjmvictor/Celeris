<details class="call-icon-picker" data-call-icon-picker>
  <summary title="Selecionar ícone">
    <span class="call-icon-picker-selected" data-call-icon-selected>{% if selected_icon %}{{ selected_icon.ds_svg|safe }}{% endif %}</span>
  </summary>
  <div class="call-icon-picker-options">
    <label title="Sem ícone"><input type="radio" name="{{ input_prefix }}{{ input_suffix }}{{ input_name }}" value="" data-call-icon-option data-icon-svg="" {% if not selected_icon %}checked{% endif %}><span>—</span></label>
    {% for icone in icones %}
      <label title="{{ icone.nm_icone }}"><input type="radio" name="{{ input_prefix }}{{ input_suffix }}{{ input_name }}" value="{{ icone.pk }}" data-call-icon-option data-icon-svg="{{ icone.ds_svg|escape }}" {% if selected_icon.pk == icone.pk %}checked{% endif %}><span>{{ icone.ds_svg|safe }}</span></label>
    {% endfor %}
  </div>
</details>
