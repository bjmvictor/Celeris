{% extends "base/layout.html" %}

{% block content %}
  <form class="card password-form compact-password-form" data-primary-form method="post" autocomplete="off">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Login {{ form.username }} {{ form.username.errors }}</label>
    <label>Nova Senha {{ form.new_password1 }} {{ form.new_password1.errors }}</label>
    <label>Confirmar Senha {{ form.new_password2 }} {{ form.new_password2.errors }}</label>
    <label class="provider-checkbox field-fluid password-checkbox">{{ form.must_change_password }} <span>Alterar no próximo login</span></label>
  </form>
{% endblock %}
